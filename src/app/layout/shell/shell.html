<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="RallyStats overview">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="5" fill="#15803D" />
        <path d="M6 18 L18 6" stroke="#A3E635" stroke-width="3" stroke-linecap="round" />
        <path d="M6 12 V18 H12" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-name">Rally<strong>Stats</strong></span>
    </a>

    <nav class="nav" aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

<p-toast position="bottom-right" [life]="3500" />
<p-confirmdialog [style]="{ width: '420px', maxWidth: 'calc(100vw - 32px)' }" />
