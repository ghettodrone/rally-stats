<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/matches" aria-label="RallyStats match history">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="5" fill="#15803D" />
        
        <ellipse
          cx="13"
          cy="9"
          rx="4.2"
          ry="6"
          transform="rotate(42 13 9)"
          fill="none"
          stroke="#A3E635"
          stroke-width="1.6"
        />

        <path
          d="M9.7 5.5 L16.3 12.5 M8.5 8 L14.5 14 M11 4 L17 10
            M10 12 L15 6 M12 14 L16 8"
          stroke="#A3E635"
          stroke-width="0.45"
          opacity="0.9"
        />

        <path
          d="M10.2 12.2 L5.5 18"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M4.7 18.5 L6.3 19.8"
          stroke="#FFFFFF"
          stroke-width="2.2"
          stroke-linecap="round"
        />
      </svg>
      <span class="brand-name">Rally<strong>Stats</strong></span>
    </a>

    <nav class="nav" aria-label="Main">
      @for (item of nav; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
        >
          <i [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

<p-toast position="bottom-right" [life]="3500" />
<p-confirmdialog [style]="{ width: '420px', maxWidth: 'calc(100vw - 32px)' }" />
